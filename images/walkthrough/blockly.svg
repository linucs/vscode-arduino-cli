  <!-- Generated code -->
  <rect x="190" y="50" width="80" height="80" rx="4" fill="#0d0d0d" stroke="#454545" stroke-width="1"/>
  <text x="200" y="68" font-size="8" font-family="monospace" fill="#569cd6">void <tspan fill="#dcdcaa">loop</tspan>() {</text>
  <text x="206" y="84" font-size="8" font-family="monospace" fill="#dcdcaa">digitalWrite<tspan fill="#d4d4d4">(13,1);</tspan></text>
  <text x="206" y="100" font-size="8" font-family="monospace" fill="#dcdcaa">delay<tspan fill="#d4d4d4">(500);</tspan></text>
  <text x="200" y="116" font-size="8" font-family="monospace" fill="#d4d4d4">}</text>
  <text x="150" y="160" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#8b8b8b">Blocks Editor — optional</text>
