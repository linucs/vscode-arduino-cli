<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#1e1e1e" rx="8"/>
  <!-- Stacked blocks with connector tabs -->
  <rect x="40" y="52" width="90" height="22" rx="3" fill="#5b80a5"/>
  <rect x="62" y="74" width="14" height="5" rx="1" fill="#5b80a5"/>
  <rect x="40" y="79" width="90" height="22" rx="3" fill="#a5745b"/>
  <rect x="62" y="101" width="14" height="5" rx="1" fill="#a5745b"/>
  <rect x="40" y="106" width="90" height="22" rx="3" fill="#7a5ba5"/>
  <text x="85" y="67" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#fff">pinMode</text>
  <text x="85" y="94" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#fff">digitalWrite</text>
  <text x="85" y="121" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#fff">delay</text>
  <!-- Arrow -->
  <line x1="142" y1="90" x2="170" y2="90" stroke="#27c93f" stroke-width="2"/>
