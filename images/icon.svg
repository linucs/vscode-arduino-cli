<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Board background (Arduino teal) -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#008184"/>

  <!-- Circuit traces -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M20 40 H44 V64"/>
    <path d="M20 88 H40 V72 H52"/>
    <path d="M108 44 H86 V60"/>
    <path d="M108 92 H84 V76 H72"/>
  </g>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="20" cy="40" r="5"/>
    <circle cx="20" cy="88" r="5"/>
    <circle cx="108" cy="44" r="5"/>
    <circle cx="108" cy="92" r="5"/>
  </g>

  <!-- Central chip -->
  <rect x="44" y="44" width="40" height="40" rx="6" fill="#ffffff"/>
  <!-- chip pins -->
  <g fill="#ffffff">
    <rect x="50" y="36" width="4" height="9" rx="1"/>
    <rect x="62" y="36" width="4" height="9" rx="1"/>
    <rect x="74" y="36" width="4" height="9" rx="1"/>
    <rect x="50" y="83" width="4" height="9" rx="1"/>
    <rect x="62" y="83" width="4" height="9" rx="1"/>
    <rect x="74" y="83" width="4" height="9" rx="1"/>
  </g>
  <!-- Arduino-style infinity mark on the chip -->
  <g stroke="#008184" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M57 64 a5 5 0 1 0 5 -5 a5 5 0 0 1 5 -5 a5 5 0 1 1 5 5"/>
    <line x1="54.5" y1="64" x2="59.5" y2="64"/>
    <line x1="68.5" y1="64" x2="73.5" y2="64"/>
  </g>
</svg>
